name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Test (with coverage thresholds)
        run: bun run test:coverage

      - name: Build
        run: bun run build

      - name: Setup Node (for the plain-Node CLI smoke test)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Smoke test built CLI under plain Node
        run: |
          node dist/cli.js --version
          node dist/cli.js --help
