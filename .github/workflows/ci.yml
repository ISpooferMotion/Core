name: CI

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pull_request:
    branches: ["main"]

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - run: bun run verify:lock
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test:coverage
      - run: bun run build
      - run: bun run docs
      - run: node dist/cli.js --version
      - run: node dist/cli.js --help

      - name: Install and smoke-test packed package
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail

          PACK_DIR="$(mktemp -d)"
          CONSUMER_DIR="$(mktemp -d)"

          cleanup() {
            rm -rf "$PACK_DIR" "$CONSUMER_DIR"
          }

          trap cleanup EXIT

          npm pack \
            --ignore-scripts \
            --pack-destination "$PACK_DIR" \
            >/dev/null

          TARBALL_PATH="$(find "$PACK_DIR" -maxdepth 1 -type f -name '*.tgz' -print -quit)"

          if [[ -z "$TARBALL_PATH" || ! -f "$TARBALL_PATH" ]]; then
            echo "Packed tarball was not created."
            exit 1
          fi

          echo "Testing package: $TARBALL_PATH"

          cd "$CONSUMER_DIR"

          npm init -y >/dev/null

          npm install \
            --ignore-scripts \
            --no-audit \
            --no-fund \
            "$TARBALL_PATH" \
            react@19 \
            react-dom@19

          node --input-type=module <<'NODE'
          const module = await import("@ispoofermotion/core");

          if (typeof module.createApp !== "function") {
            throw new Error("ESM export createApp is missing.");
          }

          if (typeof module.getFocusedId !== "function") {
            throw new Error("ESM export getFocusedId is missing.");
          }
          NODE

          node <<'NODE'
          const module = require("@ispoofermotion/core");

          if (typeof module.createApp !== "function") {
            throw new Error("CommonJS export createApp is missing.");
          }

          if (typeof module.getFocusedId !== "function") {
            throw new Error("CommonJS export getFocusedId is missing.");
          }
          NODE

          test -f node_modules/@ispoofermotion/core/dist/styles.css
          test -x node_modules/.bin/ism-core

          ./node_modules/.bin/ism-core --version
          ./node_modules/.bin/ism-core --help

  react-18:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - run: bun run verify:lock
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: npm install --no-save --package-lock=false --legacy-peer-deps react@18 react-dom@18 @types/react@18 @types/react-dom@18
      - run: bun run typecheck
      - run: bun run test
